name: CI
on:
  pull_request:
    branches: [ "master" ]
  push:

jobs:

  build:
    name: "Build module with Node.js 24"
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test dependency label assignment
        run: node --test .github/scripts/dependabot/classify.test.cjs

      - name: Check code style (formatting, imports, and lint)
        run: yarn run lint:ts

      - name: Lint Markdown
        run: yarn run lint:md

      - name: Build
        run: yarn run build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            lib/**/*.js
            lib/**/*.js.map
            lib/**/*.d.ts
            test/**/*.js
            test/**/*.js.map

  test-nodejs:
    name: "Test with Node.js ${{ matrix.node-version }}"
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.6.0, 20.x, 22.x, 24.x, 26.x]

    steps:

      - name: 'Checkout the repository'
        uses: actions/checkout@v7

      # Install development tools with the build Node.js version.
      - name: Setup Node.js 24 for dependencies
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build

      - name: Setup runtime Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # Run the compiled build without Yarn, TypeScript or tsx on older runtimes.
      - name: Test with Node.js ${{ matrix.node-version }}
        run: node node_modules/mocha/bin/mocha.js --no-config 'test/*.js'

  coverage:
    name: "Coverage with Node.js 24"
    runs-on: ubuntu-latest
    needs: build
    environment: ci

    steps:

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build

      - name: Test with coverage
        run: node node_modules/c8/bin/c8.js node node_modules/mocha/bin/mocha.js --no-config 'test/*.js'

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ./coverage/lcov.info

  test-bun:
    name: "Test with Bun ${{ matrix.bun-version }}"
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        bun-version: ['1.2.x', '1.3.x', '1.4.x']

    steps:

      - name: 'Checkout the repository'
        uses: actions/checkout@v7

      - name: Setup Node.js 24 for dependencies
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Setup Bun ${{ matrix.bun-version }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build

      - name: Unit tests with Bun ${{ matrix.bun-version }}
        run: bun run node_modules/mocha/bin/mocha.js --no-config 'test/*.js'
